# ScopeLock web tier: static SPA + same-origin /api/* proxy to the API service.
# The API reads the client IP from X-Forwarded-For (first entry) for rate
# limiting; keep the header below in sync with apps/api/src/app.ts trust proxy.
upstream scopelock_api {
  server api:4000;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Signed upload PUTs proxy through /api/; allow the largest per-file quota.
  client_max_body_size 110m;

  location /api/ {
    proxy_pass http://scopelock_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
