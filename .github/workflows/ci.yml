name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      RATE_LIMIT_DISABLED: "1"
      OUTBOX_AUTODRAIN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:contracts
      # Advisory scan: fails loudly in the log but does not block while
      # transitive-only criticals (see docs/OPERATIONS.md) await upstream fixes.
      - name: Vulnerability scan (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scopelock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopelock_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scopelock_test
      RATE_LIMIT_DISABLED: "1"
      OUTBOX_AUTODRAIN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations must apply cleanly to a fresh database…
      - run: npx prisma migrate deploy --schema prisma/schema.prisma
      # …and the migrated database must match the Prisma schema exactly.
      - run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --script --exit-code
      - run: npm run build:packages
      - run: npx vitest run tests/prisma-smoke.test.ts
        working-directory: apps/api

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    env:
      RATE_LIMIT_DISABLED: "1"
      OUTBOX_AUTODRAIN: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      # Local-trial configuration: development mode with localhost URLs, so the
      # production fail-closed boot checks do not apply to this smoke test.
      - run: cp .env.example .env
      - run: |
          cat >> .env <<'EOF'
          DB_PASSWORD=ci-only-compose-password
          WEB_URL=http://localhost:8080
          API_URL=http://localhost:8080
          AUTH_URL=http://localhost:8080
          RATE_LIMIT_DISABLED=1
          EOF
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d
      - name: Smoke-test the self-host stack
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect --format='{{.State.Health.Status}}' scopelock-api-1 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 10
          done
          [ "$(docker inspect --format='{{.State.Health.Status}}' scopelock-api-1)" = "healthy" ]
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
          # Unauthenticated API call through the nginx proxy: 401 proves the proxy works.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)" = "401" ]
      - name: API logs on failure
        if: failure()
        run: docker compose logs api
      - name: Tear down
        if: always()
        run: docker compose down -v
